name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Notebook regenerates and validates
        run: |
          python build_notebook.py
          python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/fxnews_qlora.ipynb', as_version=4))"
